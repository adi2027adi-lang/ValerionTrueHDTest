
name: Build Valerion AIDL Codec Reader

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-armv7:
    runs-on: ubuntu-22.04
    env:
      ANDROID_NDK_VERSION: 28.2.13676358

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;$ANDROID_NDK_VERSION"

      - name: Build ARMv7 reader
        shell: bash
        run: |
          set -euxo pipefail
          NDK="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi31-clang++"
          "$CXX" -O2 -fPIE -pie -static-libstdc++ \
            valerion_aidl_codec_reader.cpp \
            -o valerion_aidl_codec_reader \
            -ldl
          file valerion_aidl_codec_reader
          sha256sum valerion_aidl_codec_reader > valerion_aidl_codec_reader.sha256

      - name: Upload reader
        uses: actions/upload-artifact@v4
        with:
          name: Valerion-AIDL-CodecReader-ARMv7
          path: |
            valerion_aidl_codec_reader
            valerion_aidl_codec_reader.sha256
          if-no-files-found: error
          retention-days: 14
