# References: https://developer.android.com/reference/android/media/AudioTrack
# Kodi base: https://github.com/xbmc/xbmc/tree/9c56bf593441a6c246fdc6931177e71f349ee2bc
# Diagnostic build, not a confirmed Atmos fix.
# FIX7 tests the vendor-discovered MM contract: MediaTek forces MatMlpOnly=1 for InputSource=MM.
# Kodi keeps the stock RAW TrueHD 24-frame aggregation and opens Android ENCODING_DOLBY_MAT=19.
# No CPackerMAT transformation is used. The first aggregated MLP/TrueHD block is dumped.
# Blocking AudioTrack calls can still stall inside Android/vendor code.
# Package remains org.xbmc.kodi.valerionmat; signing key remains disposable.
name: Build Kodi Valerion MAT FIX7 MLP-Only Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-kodi-valerion-mat.yml'
      - '.github/workflows/build-kodi-valerion-mat-FIX7.yml'

permissions:
  contents: read

jobs:
  build-armv7:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      KODI_COMMIT: 9c56bf593441a6c246fdc6931177e71f349ee2bc
      ANDROID_NDK_VERSION: 28.2.13676358
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf bison build-essential ccache curl flex gawk git gperf \
            lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev \
            unzip zip zlib1g-dev python3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK tools
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install Android SDK build tools and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'build-tools;37.0.0' "ndk;$ANDROID_NDK_VERSION"
          sdkmanager 'platforms;android-37.0' || sdkmanager 'platforms;android-37'

      - name: Cache Kodi source tarballs
        uses: actions/cache@v4
        with:
          path: ~/android-tools/xbmc-tarballs
          key: kodi-android-armv7-tarballs-${{ env.KODI_COMMIT }}
          restore-keys: |
            kodi-android-armv7-tarballs-

      - name: Fetch pinned Kodi source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir kodi
          git -C kodi init
          git -C kodi remote add origin https://github.com/xbmc/xbmc.git
          git -C kodi fetch --depth=1 origin "$KODI_COMMIT"
          git -C kodi checkout --detach FETCH_HEAD
          test "$(git -C kodi rev-parse HEAD)" = "$KODI_COMMIT"
          git -C kodi rev-parse HEAD | tee kodi-upstream-commit.txt

      - name: Apply Valerion direct Dolby MAT patch
        shell: bash
        run: |
          set -euxo pipefail
          cat > "$RUNNER_TEMP/apply_valerion_mat_patch.py" <<'VALERION_PATCH'
          #!/usr/bin/env python3
          from pathlib import Path
          import sys
          
          ROOT = Path(sys.argv[1] if len(sys.argv) > 1 else ".").resolve()
          AUDIO = ROOT / "xbmc/cores/AudioEngine/Sinks/AESinkAUDIOTRACK.cpp"
          ACTIVE = ROOT / "xbmc/cores/AudioEngine/Engines/ActiveAE/ActiveAESink.cpp"
          PROCESS = ROOT / "xbmc/cores/VideoPlayer/Process/android/ProcessInfoAndroid.cpp"
          VERSION = ROOT / "version.txt"
          STRINGS = ROOT / "tools/android/packaging/xbmc/strings.xml.in"
          
          def replace_once(path: Path, old: str, new: str, label: str):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly 1 match in {path}, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"patched: {label}")
          
          # Separate Android package, so stock Kodi and the first Valerion test build stay untouched.
          replace_once(
              VERSION,
              "APP_PACKAGE org.xbmc.kodi\n",
              "APP_PACKAGE org.xbmc.kodi.valerionmat\n",
              "separate Android package",
          )
          replace_once(
              STRINGS,
              '    <string name="app_name">@APP_NAME@</string>\n',
              '    <string name="app_name">Kodi Valerion MAT Test</string>\n',
              "MAT test app label",
          )
          replace_once(
              STRINGS,
              '    <string name="search_hint">@APP_NAME@</string>\n',
              '    <string name="search_hint">Kodi Valerion MAT Test</string>\n',
              "MAT test search label",
          )
          
          # FIX7: use Kodi's stock RAW TrueHD preparation.
          # CDVDAudioCodecPassthrough::PackTrueHD() aggregates 24 raw TrueHD/MLP frames.
          # This deliberately avoids CPackerMAT because the Valerion MM pipeline itself forces
          # the vendor-private decoder parameter MatMlpOnly=1.
          replace_once(
              PROCESS,
              """bool CProcessInfoAndroid::WantsRawPassthrough()
          {
            const std::string device = CServiceBroker::GetSettingsComponent()->GetSettings()->GetString(
                CSettings::SETTING_AUDIOOUTPUT_PASSTHROUGHDEVICE);
          
            if (std::string::npos != device.find("(RAW)"))
              return true;
          
            return false;
          }
          """,
              """bool CProcessInfoAndroid::WantsRawPassthrough()
          {
            return true;
          }
          """,
              "FIX7 force stock RAW TrueHD aggregation",
          )
          
          # FIX7: keep the sink on the RAW bookkeeping path for TrueHD.
          # Upstream supplies Kodi's stock 24-frame raw TrueHD/MLP aggregation.
          replace_once(
              AUDIO,
              '  // try to recover used device\n  if (!m_hasIEC)\n    m_info = m_info_raw;\n  else if (device == "Default" && !m_info.m_wantsIECPassthrough)\n    m_info = m_info_raw;\n  else if (device == "AudioTrack (RAW)")\n    m_info = m_info_raw;\n  else\n    m_info = m_info_iec;\n\n  m_format      = format;\n',
              '  // Valerion MAT FIX7: MLP-only probe uses RAW bookkeeping semantics.\n'
              '  const bool valerionTrueHDTest =\n'
              '      format.m_dataFormat == AE_FMT_RAW &&\n'
              '      format.m_streamInfo.m_type == CAEStreamInfo::STREAM_TYPE_TRUEHD;\n\n'
              '  if (valerionTrueHDTest)\n'
              '  {\n'
              '    m_info = m_info_raw;\n'
              '    CLog::Log(LOGINFO, "VALERION_MAT: FIX7 forcing RAW sink capability for TrueHD");\n'
              '  }\n'
              '  else if (!m_hasIEC)\n'
              '    m_info = m_info_raw;\n'
              '  else if (device == "Default" && !m_info.m_wantsIECPassthrough)\n'
              '    m_info = m_info_raw;\n'
              '  else if (device == "AudioTrack (RAW)")\n'
              '    m_info = m_info_raw;\n'
              '  else\n'
              '    m_info = m_info_iec;\n\n'
              '  m_format      = format;\n',
              "FIX7 force RAW sink semantics for TrueHD",
          )
          
          # FIX7: ActiveAE must NOT run the late IEC61937 packer for this isolated TrueHD test,
          # regardless of which passthrough device Kodi auto-selected in settings.
          replace_once(
              ACTIVE,
              """  if (passthrough)
            {
              m_needIecPack = NeedIECPacking();
              if (m_needIecPack)
              {
                m_packer = std::make_unique<CAEBitstreamPacker>();
                m_requestedFormat.m_sampleRate = CAEBitstreamPacker::GetOutputRate(m_requestedFormat.m_streamInfo);
                m_requestedFormat.m_channelLayout = CAEBitstreamPacker::GetOutputChannelMap(m_requestedFormat.m_streamInfo);
              }
            }
          """,
              """  if (passthrough)
            {
              const bool valerionTrueHDTest =
                  m_requestedFormat.m_streamInfo.m_type == CAEStreamInfo::STREAM_TYPE_TRUEHD;
          
              m_needIecPack = valerionTrueHDTest ? false : NeedIECPacking();
          
              if (valerionTrueHDTest)
                CLog::Log(LOGINFO,
                          "VALERION_MAT: FIX7 ActiveAE forcing m_needIecPack=false for TrueHD");
              else if (m_needIecPack)
              {
                m_packer = std::make_unique<CAEBitstreamPacker>();
                m_requestedFormat.m_sampleRate =
                    CAEBitstreamPacker::GetOutputRate(m_requestedFormat.m_streamInfo);
                m_requestedFormat.m_channelLayout =
                    CAEBitstreamPacker::GetOutputChannelMap(m_requestedFormat.m_streamInfo);
              }
            }
          """,
              "FIX7 disable late IEC packing for TrueHD",
          )
          
          # Android public API AudioFormat.ENCODING_DOLBY_MAT == 19 (API 29+).
          replace_once(
              AUDIO,
              "const unsigned int TRUEHD_SIZE = 61440;\n",
              '''const unsigned int TRUEHD_SIZE = 61440;
          constexpr int VALERION_ENCODING_DOLBY_MAT = 19;
          ''',
              "FIX7 MAT encoding constant",
          )
          
          # FIX7: declare Android MAT while keeping the stock RAW TrueHD/MLP payload.
          replace_once(
              AUDIO,
              """    m_passthrough = true;
              m_encoding = AEStreamFormatToATFormat(m_format.m_streamInfo.m_type);
              m_format.m_channelLayout = AE_CH_LAYOUT_2_0;
          """,
              """    m_passthrough = true;
              m_encoding = AEStreamFormatToATFormat(m_format.m_streamInfo.m_type);
          
              if (m_format.m_streamInfo.m_type == CAEStreamInfo::STREAM_TYPE_TRUEHD)
              {
                m_encoding = VALERION_ENCODING_DOLBY_MAT;
                CLog::Log(LOGINFO, "VALERION_MAT: BEGIN FIX7 MM-MAT MLP-ONLY PROBE");
                CLog::Log(LOGINFO,
                          "VALERION_MAT: payload=stock-RAW-TrueHD/MLP androidEncoding={} lateIecPack=DISABLED",
                          m_encoding);
              }
          
              m_format.m_channelLayout = AE_CH_LAYOUT_2_0;
          """,
              "FIX7 select Android Dolby MAT with RAW TrueHD payload",
          )
          
          # FIX7 MLP-only writer.
          # Upstream is stock Kodi RAW TrueHD: PackTrueHD() groups 24 parsed TrueHD/MLP frames.
          # The byte block is passed unchanged to AudioTrack ENCODING_DOLBY_MAT=19.
          # This directly probes Valerion's MM pipeline contract: filter "Mat" + MatMlpOnly=1.
          old = '''  else if (m_jniAudioFormat == CJNIAudioFormat::ENCODING_IEC61937)
            {
              if (m_shortbuf.size() < (sizeInBytes - offsetInBytes) / sizeof(int16_t))
                m_shortbuf.resize((sizeInBytes - offsetInBytes) / sizeof(int16_t));
              memcpy(m_shortbuf.data(), audioData + offsetInBytes, sizeInBytes - offsetInBytes);
              written = m_at_jni->write(m_shortbuf, 0, (sizeInBytes - offsetInBytes) / sizeof(int16_t),
                                        CJNIAudioTrack::WRITE_BLOCKING);
              written *= sizeof(uint16_t);
            }
          '''
          new = r'''  else if (m_jniAudioFormat == VALERION_ENCODING_DOLBY_MAT &&
                     m_format.m_streamInfo.m_type == CAEStreamInfo::STREAM_TYPE_TRUEHD)
            {
              if (m_valerionMatFailed)
                return -1;
              if (offsetInBytes < 0 || sizeInBytes < offsetInBytes || !audioData)
              {
                m_valerionMatFailed = true;
                CLog::Log(LOGERROR, "VALERION_MAT: FIX7 invalid input arguments");
                return -1;
              }

              const int inputSize = sizeInBytes - offsetInBytes;
              if (inputSize == 0)
                return 0;

              if (static_cast<int>(m_charbuf.size()) < inputSize)
                m_charbuf.resize(inputSize);
              memcpy(m_charbuf.data(), audioData + offsetInBytes, inputSize);

              const bool diagnosticThisCall = ((m_valerionMatCalls++ & 0x3f) == 0);
              if (diagnosticThisCall)
              {
                const unsigned char* in =
                    reinterpret_cast<const unsigned char*>(m_charbuf.data());
                CLog::Log(LOGINFO,
                          "VALERION_MAT: FIX7 raw-MLP inputBytes={} head={:02x} {:02x} {:02x} {:02x} "
                          "{:02x} {:02x} {:02x} {:02x}",
                          inputSize,
                          inputSize > 0 ? static_cast<unsigned int>(in[0]) : 0,
                          inputSize > 1 ? static_cast<unsigned int>(in[1]) : 0,
                          inputSize > 2 ? static_cast<unsigned int>(in[2]) : 0,
                          inputSize > 3 ? static_cast<unsigned int>(in[3]) : 0,
                          inputSize > 4 ? static_cast<unsigned int>(in[4]) : 0,
                          inputSize > 5 ? static_cast<unsigned int>(in[5]) : 0,
                          inputSize > 6 ? static_cast<unsigned int>(in[6]) : 0,
                          inputSize > 7 ? static_cast<unsigned int>(in[7]) : 0);
              }

              if (!m_valerionMatDumped)
              {
                m_valerionMatDumped = true;
                XFILE::CFile file;
                const std::string path = "special://temp/valerion-mat-FIX7-mlp.bin";
                if (!file.OpenForWrite(path, true))
                {
                  CLog::Log(LOGERROR, "VALERION_MAT: FIX7 dump open failed {}", path);
                }
                else
                {
                  size_t done = 0;
                  while (done < static_cast<size_t>(inputSize))
                  {
                    const auto n = file.Write(m_charbuf.data() + done,
                                              static_cast<size_t>(inputSize) - done);
                    if (n <= 0 || static_cast<size_t>(n) > static_cast<size_t>(inputSize) - done)
                      break;
                    done += static_cast<size_t>(n);
                  }
                  file.Close();
                  CLog::Log(LOGINFO,
                            "VALERION_MAT: FIX7 dump {} bytes={}/{} complete={}",
                            path, done, inputSize, done == static_cast<size_t>(inputSize));
                }
              }

              const uint64_t writeStart = CurrentHostCounter();
              int accepted = 0;
              unsigned int writeCalls = 0;
              while (accepted < inputSize)
              {
                const int n = m_at_jni->write(m_charbuf, accepted, inputSize - accepted,
                                              CJNIAudioTrack::WRITE_BLOCKING);
                ++writeCalls;
                if (n == 0 && accepted == 0)
                  return 0;
                if (n <= 0 || n > inputSize - accepted)
                {
                  m_valerionMatFailed = true;
                  CLog::Log(LOGERROR,
                            "VALERION_MAT: FIX7 write stopped accepted={} expected={} result={} STOP",
                            accepted, inputSize, n);
                  return -1;
                }
                accepted += n;
              }

              if (diagnosticThisCall || writeCalls > 1)
              {
                const double writeMs =
                    1000.0 * (CurrentHostCounter() - writeStart) / CurrentHostFrequency();
                CLog::Log(LOGINFO,
                          "VALERION_MAT: FIX7 inputBytes={} result={} calls={} writeMs={} headPos={} durationMs={}",
                          inputSize, accepted, writeCalls, writeMs,
                          m_at_jni->getPlaybackHeadPosition(), m_duration_written * 1000.0);
              }

              written = inputSize;
            }
            else if (m_jniAudioFormat == CJNIAudioFormat::ENCODING_IEC61937)
            {
              if (m_shortbuf.size() < (sizeInBytes - offsetInBytes) / sizeof(int16_t))
                m_shortbuf.resize((sizeInBytes - offsetInBytes) / sizeof(int16_t));
              memcpy(m_shortbuf.data(), audioData + offsetInBytes, sizeInBytes - offsetInBytes);
              written = m_at_jni->write(m_shortbuf, 0, (sizeInBytes - offsetInBytes) / sizeof(int16_t),
                                        CJNIAudioTrack::WRITE_BLOCKING);
              written *= sizeof(uint16_t);
            }
          '''
          replace_once(AUDIO, old, new, "FIX7 raw MLP payload writer")
          
          # Log Android's buffer query and AudioTrack state around the single creation attempt.
          old = '''    m_min_buffer_size = (unsigned int) min_buffer;
              CLog::Log(LOGINFO, "Minimum size we need for stream: {} Bytes", m_min_buffer_size);
          '''
          new = '''    m_min_buffer_size = (unsigned int) min_buffer;
              CLog::Log(LOGINFO, "Minimum size we need for stream: {} Bytes", m_min_buffer_size);
              if (m_encoding == VALERION_ENCODING_DOLBY_MAT &&
                  m_format.m_streamInfo.m_type == CAEStreamInfo::STREAM_TYPE_TRUEHD)
              {
                CLog::Log(LOGINFO,
                          "VALERION_MAT: getMinBufferSize={} sampleRate={} channelMask={} encoding={}",
                          min_buffer, m_sink_sampleRate, atChannelMask, m_encoding);
              }
          '''
          replace_once(AUDIO, old, new, "MAT min buffer diagnostics")
          
          # FIX7: keep Kodi's STOCK RAW TrueHD geometry.
          # The RAW branch should produce frameSize=1, frames=61440 and buffer=122880.
          old = '''    if (m_passthrough && !m_info.m_wantsIECPassthrough)
                m_audiotrackbuffer_sec = rawlength_in_seconds;
          
              CLog::Log(LOGINFO,
                        "Created Audiotrackbuffer with playing time of {:f} ms min buffer size: {} bytes",
                        m_audiotrackbuffer_sec * 1000, m_min_buffer_size);
          '''
          new = '''    if (m_passthrough && !m_info.m_wantsIECPassthrough)
                m_audiotrackbuffer_sec = rawlength_in_seconds;
          
              if (m_encoding == VALERION_ENCODING_DOLBY_MAT &&
                  m_format.m_streamInfo.m_type == CAEStreamInfo::STREAM_TYPE_TRUEHD)
              {
                CLog::Log(LOGINFO,
                          "VALERION_MAT: FIX7 geometry method=RAW frameSize={} frames={} buffer={} rate={} channels={}",
                          m_format.m_frameSize, m_format.m_frames, m_min_buffer_size,
                          m_sink_sampleRate, m_format.m_channelLayout.Count());
          
                if (m_format.m_frameSize != 1 || m_format.m_frames != TRUEHD_SIZE)
                {
                  CLog::Log(LOGERROR,
                            "VALERION_MAT: FIX7 unsafe geometry - refusing probe");
                  return false;
                }
              }
          
              CLog::Log(LOGINFO,
                        "Created Audiotrackbuffer with playing time of {:f} ms min buffer size: {} bytes",
                        m_audiotrackbuffer_sec * 1000, m_min_buffer_size);
          '''
          replace_once(AUDIO, old, new, "FIX7 preserve and verify RAW geometry")
          
          old = '''    m_jniAudioFormat = m_encoding;
              m_at_jni = CreateAudioTrack(stream, m_sink_sampleRate, atChannelMask,
                                          m_encoding, m_min_buffer_size);
          
              if (!IsInitialized())
          '''
          new = '''    m_jniAudioFormat = m_encoding;
              if (m_encoding == VALERION_ENCODING_DOLBY_MAT &&
                  m_format.m_streamInfo.m_type == CAEStreamInfo::STREAM_TYPE_TRUEHD)
              {
                CLog::Log(LOGINFO,
                          "VALERION_MAT: FIX7 creating AudioTrack requestedBuffer={} mode=STREAM",
                          m_min_buffer_size);
              }
              m_at_jni = CreateAudioTrack(stream, m_sink_sampleRate, atChannelMask,
                                          m_encoding, m_min_buffer_size);
          
              if (m_encoding == VALERION_ENCODING_DOLBY_MAT &&
                  m_format.m_streamInfo.m_type == CAEStreamInfo::STREAM_TYPE_TRUEHD)
              {
                const int state = m_at_jni ? m_at_jni->getState() : -1;
                CLog::Log(LOGINFO, "VALERION_MAT: FIX7 AudioTrack state={}", state);
              }
          
              if (!IsInitialized())
          '''
          replace_once(AUDIO, old, new, "MAT AudioTrack creation diagnostics")
          
          # Q0718 safety: for this MAT experiment, never perform Kodi's stock 200 ms
          # passthrough retry. Release once and return.
          old = '''      else
                {
                  if (!retried)
                  {
                    retried = true;
                    CLog::Log(LOGWARNING, "AESinkAUDIOTRACK - Unable to open PT device - will retry once");
                    // Seems that some devices don't properly implement pause + flush, which during seek
                    // might open the device too fast - let's retry
                    usleep(200 * 1000);
                    continue;
                  }
                }
          '''
          new = '''      else
                {
                  if (m_encoding == VALERION_ENCODING_DOLBY_MAT &&
                      m_format.m_streamInfo.m_type == CAEStreamInfo::STREAM_TYPE_TRUEHD)
                  {
                    CLog::Log(LOGERROR,
                              "VALERION_MAT: AudioTrack initialization failed - NO RETRY");
                  }
                  else if (!retried)
                  {
                    retried = true;
                    CLog::Log(LOGWARNING, "AESinkAUDIOTRACK - Unable to open PT device - will retry once");
                    // Seems that some devices don't properly implement pause + flush, which during seek
                    // might open the device too fast - let's retry
                    usleep(200 * 1000);
                    continue;
                  }
                }
          '''
          replace_once(AUDIO, old, new, "disable MAT retry")
          
          # Log the first transition to PLAYING for the MAT track.
          old = '''    if (m_at_jni->getPlayState() != CJNIAudioTrack::PLAYSTATE_PLAYING)
                m_at_jni->play();
          '''
          new = '''    if (m_at_jni->getPlayState() != CJNIAudioTrack::PLAYSTATE_PLAYING)
              {
                if (m_jniAudioFormat == VALERION_ENCODING_DOLBY_MAT &&
                    m_format.m_streamInfo.m_type == CAEStreamInfo::STREAM_TYPE_TRUEHD)
                  CLog::Log(LOGINFO, "VALERION_MAT: FIX7 play() reached");
                m_at_jni->play();
              }
          '''
          replace_once(AUDIO, old, new, "MAT play diagnostics")
          
          print("Valerion MAT FIX7 MLP-only probe applied successfully (stock RAW TrueHD payload + encoding 19).")
          
          HEADER = ROOT / "xbmc/cores/AudioEngine/Sinks/AESinkAUDIOTRACK.h"
          replace_once(AUDIO, '#include "ServiceBroker.h"\n',
                       '#include "ServiceBroker.h"\n#include "filesystem/File.h"\n', "FIX7 dump API")
          replace_once(HEADER, '  std::vector<char> m_charbuf;\n',
                       '  bool m_valerionMatFailed = false;\n'
                       '  bool m_valerionMatDumped = false;\n'
                       '  unsigned int m_valerionMatCalls = 0;\n'
                       '  std::vector<char> m_charbuf;\n', "FIX7 per-track diagnostic state")
          replace_once(AUDIO,
                       'bool CAESinkAUDIOTRACK::Initialize(AEAudioFormat &format, std::string &device)\n{\n',
                       'bool CAESinkAUDIOTRACK::Initialize(AEAudioFormat &format, std::string &device)\n{\n'
                       '  m_valerionMatFailed = false;\n'
                       '  m_valerionMatDumped = false;\n'
                       '  m_valerionMatCalls = 0;\n', "FIX7 reset state on initialization")
          VALERION_PATCH
          python3 "$RUNNER_TEMP/apply_valerion_mat_patch.py" "$GITHUB_WORKSPACE/kodi"
          cp "$RUNNER_TEMP/apply_valerion_mat_patch.py" valerion-mat-patcher.py
          git -C kodi diff --check
          git -C kodi diff > valerion-mat-applied.patch
          grep -a -n 'VALERION_MAT' kodi/xbmc/cores/AudioEngine/Sinks/AESinkAUDIOTRACK.cpp
          grep -a -n 'FIX7 ActiveAE' kodi/xbmc/cores/AudioEngine/Engines/ActiveAE/ActiveAESink.cpp
          grep -a -n 'raw-MLP inputBytes' kodi/xbmc/cores/AudioEngine/Sinks/AESinkAUDIOTRACK.cpp
          grep -a -n 'return true;' kodi/xbmc/cores/VideoPlayer/Process/android/ProcessInfoAndroid.cpp
          grep '^APP_PACKAGE ' kodi/version.txt
          grep 'Kodi Valerion MAT Test' kodi/tools/android/packaging/xbmc/strings.xml.in

      - name: Create disposable APK signing key
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keypass android -storepass android \
            -keyalg RSA -keysize 2048 -validity 10000
          echo "KODI_ANDROID_STORE_FILE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo 'KODI_ANDROID_KEY_ALIAS=androiddebugkey' >> "$GITHUB_ENV"
          echo 'KODI_ANDROID_KEY_PASSWORD=android' >> "$GITHUB_ENV"
          echo 'KODI_ANDROID_STORE_PASSWORD=android' >> "$GITHUB_ENV"

      - name: Configure and build Kodi Android dependencies ARMv7
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs "$HOME/android-tools/xbmc-tarballs" "$HOME/android-tools/xbmc-depends"
          cd kodi/tools/depends
          ./bootstrap 2>&1 | tee "$GITHUB_WORKSPACE/logs/01-bootstrap.log"
          ./configure \
            --with-tarballs="$HOME/android-tools/xbmc-tarballs" \
            --host=arm-linux-androideabi \
            --with-sdk-path="$ANDROID_SDK_ROOT" \
            --with-ndk-path="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" \
            --prefix="$HOME/android-tools/xbmc-depends" \
            2>&1 | tee "$GITHUB_WORKSPACE/logs/02-depends-configure.log"
          make -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/logs/03-depends-build.log"

      - name: Configure Kodi CMake build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$HOME/kodi-build"
          make -C kodi/tools/depends/target/cmakebuildsys \
            BUILD_DIR="$HOME/kodi-build" \
            2>&1 | tee logs/04-cmake-configure.log

      - name: Build Kodi and APK
        shell: bash
        run: |
          set -o pipefail
          make -C "$HOME/kodi-build" -j"$(nproc)" 2>&1 | tee logs/05-kodi-build.log
          make -C "$HOME/kodi-build" apk 2>&1 | tee logs/06-apk-package.log

      - name: Collect and verify ARMv7 APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p output
          mapfile -t apks < <(find "$GITHUB_WORKSPACE/kodi" "$HOME/kodi-build" -type f -name '*.apk' -print | sort -u)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo 'No APK was produced.' >&2
            exit 1
          fi
          printf '%s\n' "${apks[@]}" | tee logs/07-apk-list.log
          n=0
          for apk in "${apks[@]}"; do
            n=$((n+1))
            out="output/Kodi-Valerion-MAT-Test-armv7-${n}.apk"
            cp "$apk" "$out"
            unzip -l "$out" > "logs/08-apk-contents-${n}.log"
            grep -q 'lib/armeabi-v7a/' "logs/08-apk-contents-${n}.log"
          done

      - name: Upload installable MAT APK
        uses: actions/upload-artifact@v4
        with:
          name: Kodi-Valerion-MAT-Test-ARMv7
          path: output/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload MAT patch and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kodi-Valerion-MAT-build-diagnostics
          path: |
            kodi-upstream-commit.txt
            valerion-mat-applied.patch
            valerion-mat-patcher.py
            logs/
          if-no-files-found: warn
          retention-days: 14
