# References: https://developer.android.com/reference/android/media/AudioTrack
# Kodi base: https://github.com/xbmc/xbmc/tree/9c56bf593441a6c246fdc6931177e71f349ee2bc
# Diagnostic build, not a confirmed Atmos fix. Same existing modes 0-4; default 1.
# Mode is latched per track. Restart playback after changing debug.kodi.mat.mode.
# First input/output block is overwritten in special://temp/valerion-mat-FIX6D-*.bin.
# Blocking AudioTrack calls can still stall inside Android/vendor code.
# Package remains org.xbmc.kodi.valerionmat; signing key remains disposable.
name: Build Kodi Valerion MAT FIX6D Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-kodi-valerion-mat.yml'
      - '.github/workflows/build-kodi-valerion-mat-FIX6D.yml'

permissions:
  contents: read

jobs:
  build-armv7:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      KODI_COMMIT: 9c56bf593441a6c246fdc6931177e71f349ee2bc
      ANDROID_NDK_VERSION: 28.2.13676358
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf bison build-essential ccache curl flex gawk git gperf \
            lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev \
            unzip zip zlib1g-dev python3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK tools
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install Android SDK build tools and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'build-tools;37.0.0' "ndk;$ANDROID_NDK_VERSION"
          sdkmanager 'platforms;android-37.0' || sdkmanager 'platforms;android-37'

      - name: Cache Kodi source tarballs
        uses: actions/cache@v4
        with:
          path: ~/android-tools/xbmc-tarballs
          key: kodi-android-armv7-tarballs-${{ env.KODI_COMMIT }}
          restore-keys: |
            kodi-android-armv7-tarballs-

      - name: Fetch pinned Kodi source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir kodi
          git -C kodi init
          git -C kodi remote add origin https://github.com/xbmc/xbmc.git
          git -C kodi fetch --depth=1 origin "$KODI_COMMIT"
          git -C kodi checkout --detach FETCH_HEAD
          test "$(git -C kodi rev-parse HEAD)" = "$KODI_COMMIT"
          git -C kodi rev-parse HEAD | tee kodi-upstream-commit.txt

      - name: Apply Valerion direct Dolby MAT patch
        shell: bash
        run: |
          set -euxo pipefail
          cat > "$RUNNER_TEMP/apply_valerion_mat_patch.py" <<'VALERION_PATCH'
          #!/usr/bin/env python3
          from pathlib import Path
          import sys
          
          ROOT = Path(sys.argv[1] if len(sys.argv) > 1 else ".").resolve()
          AUDIO = ROOT / "xbmc/cores/AudioEngine/Sinks/AESinkAUDIOTRACK.cpp"
          ACTIVE = ROOT / "xbmc/cores/AudioEngine/Engines/ActiveAE/ActiveAESink.cpp"
          PROCESS = ROOT / "xbmc/cores/VideoPlayer/Process/android/ProcessInfoAndroid.cpp"
          VERSION = ROOT / "version.txt"
          STRINGS = ROOT / "tools/android/packaging/xbmc/strings.xml.in"
          
          def replace_once(path: Path, old: str, new: str, label: str):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly 1 match in {path}, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"patched: {label}")
          
          # Separate Android package, so stock Kodi and the first Valerion test build stay untouched.
          replace_once(
              VERSION,
              "APP_PACKAGE org.xbmc.kodi\n",
              "APP_PACKAGE org.xbmc.kodi.valerionmat\n",
              "separate Android package",
          )
          replace_once(
              STRINGS,
              '    <string name="app_name">@APP_NAME@</string>\n',
              '    <string name="app_name">Kodi Valerion MAT Test</string>\n',
              "MAT test app label",
          )
          replace_once(
              STRINGS,
              '    <string name="search_hint">@APP_NAME@</string>\n',
              '    <string name="search_hint">Kodi Valerion MAT Test</string>\n',
              "MAT test search label",
          )
          
          # Valerion MAT test build: always use Kodi's IEC-side TrueHD preparation.
          # This makes CDVDAudioCodecPassthrough use CPackerMAT instead of the RAW TrueHD
          # 24-frame aggregation path. The package is separate from stock Kodi, so this
          # diagnostic override is isolated to the test app.
          replace_once(
              PROCESS,
              """bool CProcessInfoAndroid::WantsRawPassthrough()
          {
            const std::string device = CServiceBroker::GetSettingsComponent()->GetSettings()->GetString(
                CSettings::SETTING_AUDIOOUTPUT_PASSTHROUGHDEVICE);
          
            if (std::string::npos != device.find("(RAW)"))
              return true;
          
            return false;
          }
          """,
              """bool CProcessInfoAndroid::WantsRawPassthrough()
          {
            return false;
          }
          """,
              "force Kodi MAT preparation for Valerion test",
          )
          
          
          # FIX6D: Android system-property API used by the runtime mode selector.
          replace_once(
              AUDIO,
              """#include <androidjni/AudioTrack.h>
          #include <androidjni/Build.h>
          #include <unistd.h>
          """,
              """#include <androidjni/AudioTrack.h>
          #include <androidjni/Build.h>
          #include <sys/system_properties.h>
          #include <unistd.h>
          """,
              "FIX6D Android system property include",
          )
          
          # FIX6D: keep the sink on the RAW bookkeeping path for TrueHD.
          # CPackerMAT is already produced earlier because WantsRawPassthrough() is forced false.
          # This avoids the FIX3/FIX4 frame-unit mismatch (RAW bytes upstream vs 16-byte IEC frames downstream).
          replace_once(
              AUDIO,
              '  // try to recover used device\n  if (!m_hasIEC)\n    m_info = m_info_raw;\n  else if (device == "Default" && !m_info.m_wantsIECPassthrough)\n    m_info = m_info_raw;\n  else if (device == "AudioTrack (RAW)")\n    m_info = m_info_raw;\n  else\n    m_info = m_info_iec;\n\n  m_format      = format;\n',
              '  // Valerion MAT FIX6D: TrueHD test must use RAW bookkeeping semantics.\n'
              '  const bool valerionTrueHDTest =\n'
              '      format.m_dataFormat == AE_FMT_RAW &&\n'
              '      format.m_streamInfo.m_type == CAEStreamInfo::STREAM_TYPE_TRUEHD;\n\n'
              '  if (valerionTrueHDTest)\n'
              '  {\n'
              '    m_info = m_info_raw;\n'
              '    CLog::Log(LOGINFO, "VALERION_MAT: FIX6D forcing RAW sink capability for TrueHD");\n'
              '  }\n'
              '  else if (!m_hasIEC)\n'
              '    m_info = m_info_raw;\n'
              '  else if (device == "Default" && !m_info.m_wantsIECPassthrough)\n'
              '    m_info = m_info_raw;\n'
              '  else if (device == "AudioTrack (RAW)")\n'
              '    m_info = m_info_raw;\n'
              '  else\n'
              '    m_info = m_info_iec;\n\n'
              '  m_format      = format;\n',
              "FIX6D force RAW sink semantics for TrueHD",
          )
          
          # FIX6D: ActiveAE must NOT run the late IEC61937 packer for this isolated TrueHD test,
          # regardless of which passthrough device Kodi auto-selected in settings.
          replace_once(
              ACTIVE,
              """  if (passthrough)
            {
              m_needIecPack = NeedIECPacking();
              if (m_needIecPack)
              {
                m_packer = std::make_unique<CAEBitstreamPacker>();
                m_requestedFormat.m_sampleRate = CAEBitstreamPacker::GetOutputRate(m_requestedFormat.m_streamInfo);
                m_requestedFormat.m_channelLayout = CAEBitstreamPacker::GetOutputChannelMap(m_requestedFormat.m_streamInfo);
              }
            }
          """,
              """  if (passthrough)
            {
              const bool valerionTrueHDTest =
                  m_requestedFormat.m_streamInfo.m_type == CAEStreamInfo::STREAM_TYPE_TRUEHD;
          
              m_needIecPack = valerionTrueHDTest ? false : NeedIECPacking();
          
              if (valerionTrueHDTest)
                CLog::Log(LOGINFO,
                          "VALERION_MAT: FIX6D ActiveAE forcing m_needIecPack=false for TrueHD");
              else if (m_needIecPack)
              {
                m_packer = std::make_unique<CAEBitstreamPacker>();
                m_requestedFormat.m_sampleRate =
                    CAEBitstreamPacker::GetOutputRate(m_requestedFormat.m_streamInfo);
                m_requestedFormat.m_channelLayout =
                    CAEBitstreamPacker::GetOutputChannelMap(m_requestedFormat.m_streamInfo);
              }
            }
          """,
              "FIX6D disable late IEC packing for TrueHD",
          )
          
          # Android public API AudioFormat.ENCODING_DOLBY_MAT == 19 (API 29+).
          replace_once(
              AUDIO,
              "const unsigned int TRUEHD_SIZE = 61440;\n",
              '''const unsigned int TRUEHD_SIZE = 61440;
          constexpr int VALERION_ENCODING_DOLBY_MAT = 19;
          constexpr unsigned int VALERION_MAT_RESERVED = 8;
          constexpr unsigned int VALERION_MAT_PAYLOAD = TRUEHD_SIZE - VALERION_MAT_RESERVED;
          ''',
              "FIX6D MAT constants",
          )
          
          # FIX6D: native Android MAT on the RAW bookkeeping path.
          replace_once(
              AUDIO,
              """    m_passthrough = true;
              m_encoding = AEStreamFormatToATFormat(m_format.m_streamInfo.m_type);
              m_format.m_channelLayout = AE_CH_LAYOUT_2_0;
          """,
              """    m_passthrough = true;
              m_encoding = AEStreamFormatToATFormat(m_format.m_streamInfo.m_type);
          
              if (m_format.m_streamInfo.m_type == CAEStreamInfo::STREAM_TYPE_TRUEHD)
              {
                m_encoding = VALERION_ENCODING_DOLBY_MAT;
                CLog::Log(LOGINFO, "VALERION_MAT: BEGIN FIX6D RAW-MAT MULTIMODE");
                CLog::Log(LOGINFO,
                          "VALERION_MAT: codec=TrueHD androidEncoding={} lateIecPack=DISABLED",
                          m_encoding);
              }
          
              m_format.m_channelLayout = AE_CH_LAYOUT_2_0;
          """,
              "FIX6D select Android Dolby MAT on RAW TrueHD path",
          )
          
          # FIX6D multi-mode native MAT writer.
          # Input must be one original 61440-byte CPackerMAT frame:
          # [8 reserved zero bytes] + [MAT starts at 07 9E 00 03 ...].
          # No IEC61937 scanner and no assumed IEC byte swap.
          old = '''  else if (m_jniAudioFormat == CJNIAudioFormat::ENCODING_IEC61937)
            {
              if (m_shortbuf.size() < (sizeInBytes - offsetInBytes) / sizeof(int16_t))
                m_shortbuf.resize((sizeInBytes - offsetInBytes) / sizeof(int16_t));
              memcpy(m_shortbuf.data(), audioData + offsetInBytes, sizeInBytes - offsetInBytes);
              written = m_at_jni->write(m_shortbuf, 0, (sizeInBytes - offsetInBytes) / sizeof(int16_t),
                                        CJNIAudioTrack::WRITE_BLOCKING);
              written *= sizeof(uint16_t);
            }
          '''
          new = r'''  else if (m_jniAudioFormat == VALERION_ENCODING_DOLBY_MAT &&
                     m_format.m_streamInfo.m_type == CAEStreamInfo::STREAM_TYPE_TRUEHD)
            {
              if (m_valerionMatFailed)
                return -1;
              if (offsetInBytes < 0 || sizeInBytes < offsetInBytes || !audioData)
              {
                m_valerionMatFailed = true;
                CLog::Log(LOGERROR, "VALERION_MAT: FIX6D invalid input arguments");
                return -1;
              }
              const int inputSize = sizeInBytes - offsetInBytes;
              if (inputSize == 0)
                return 0;
              if (inputSize != static_cast<int>(TRUEHD_SIZE))
              {
                m_valerionMatFailed = true;
                CLog::Log(LOGERROR,
                          "VALERION_MAT: FIX6D inputSize={} expected={} STOP; no raw fallback",
                          inputSize, TRUEHD_SIZE);
                return -1;
              }
              const unsigned char* src =
                  reinterpret_cast<const unsigned char*>(audioData + offsetInBytes);
              if (m_valerionMatMode < 0)
              {
                char propVal[PROP_VALUE_MAX] = {0};
                __system_property_get("debug.kodi.mat.mode", propVal);
                m_valerionMatMode = 1;
                if (propVal[0] >= '0' && propVal[0] <= '4' && propVal[1] == 0)
                  m_valerionMatMode = propVal[0] - '0';
                CLog::Log(LOGINFO, "VALERION_MAT: FIX6D mode={} latched for this AudioTrack",
                          m_valerionMatMode);
              }
              const int mode = m_valerionMatMode;
          
              const bool hasExpectedHeader =
                  src[0] == 0x00 && src[1] == 0x00 && src[2] == 0x00 && src[3] == 0x00 &&
                  src[4] == 0x00 && src[5] == 0x00 && src[6] == 0x00 && src[7] == 0x00 &&
                  src[8] == 0x07 && src[9] == 0x9E && src[10] == 0x00 && src[11] == 0x03;
          
              const bool diagnosticThisCall = ((m_valerionMatCalls++ & 0x3f) == 0);
              if (!hasExpectedHeader)
              {
                m_valerionMatFailed = true;
                CLog::Log(LOGERROR,
                          "VALERION_MAT: FIX6D CPackerMAT signature missing STOP; no mode fallback");
                return -1;
              }
          
              if (diagnosticThisCall)
              {
                CLog::Log(LOGINFO,
                          "VALERION_MAT: FIX6D mode={} inSize={} "
                          "in16={:02x} {:02x} {:02x} {:02x} {:02x} {:02x} {:02x} {:02x} "
                          "{:02x} {:02x} {:02x} {:02x} {:02x} {:02x} {:02x} {:02x}",
                          mode, inputSize,
                          static_cast<unsigned int>(src[0]), static_cast<unsigned int>(src[1]),
                          static_cast<unsigned int>(src[2]), static_cast<unsigned int>(src[3]),
                          static_cast<unsigned int>(src[4]), static_cast<unsigned int>(src[5]),
                          static_cast<unsigned int>(src[6]), static_cast<unsigned int>(src[7]),
                          static_cast<unsigned int>(src[8]), static_cast<unsigned int>(src[9]),
                          static_cast<unsigned int>(src[10]), static_cast<unsigned int>(src[11]),
                          static_cast<unsigned int>(src[12]), static_cast<unsigned int>(src[13]),
                          static_cast<unsigned int>(src[14]), static_cast<unsigned int>(src[15]));
              }
          
              int outputSize = TRUEHD_SIZE;
              if (m_charbuf.size() < TRUEHD_SIZE)
                m_charbuf.resize(TRUEHD_SIZE);
          
              if (mode == 1)
              {
                // Existing mode 1 representation; native MAT compatibility remains unproven.
                memcpy(m_charbuf.data(), src + VALERION_MAT_RESERVED, VALERION_MAT_PAYLOAD);
                outputSize = VALERION_MAT_PAYLOAD; // 61432
              }
              else if (mode == 2)
              {
                // Shift MAT to byte 0 but retain a 61440-byte write by padding 8 zeros at the end.
                memcpy(m_charbuf.data(), src + VALERION_MAT_RESERVED, VALERION_MAT_PAYLOAD);
                memset(m_charbuf.data() + VALERION_MAT_PAYLOAD, 0, VALERION_MAT_RESERVED);
                outputSize = TRUEHD_SIZE;
              }
              else if (mode == 3)
              {
                // Counter-test: skip 8 and 16-bit swap the 61432-byte payload.
                unsigned char* dst = reinterpret_cast<unsigned char*>(m_charbuf.data());
                for (unsigned int i = 0; i < VALERION_MAT_PAYLOAD; i += 2)
                {
                  dst[i] = src[VALERION_MAT_RESERVED + i + 1];
                  dst[i + 1] = src[VALERION_MAT_RESERVED + i];
                }
                outputSize = VALERION_MAT_PAYLOAD;
              }
              else if (mode == 4)
              {
                // Counter-test: preserve the 8 leading zeros, swap only bytes 8..61439.
                memcpy(m_charbuf.data(), src, VALERION_MAT_RESERVED);
                unsigned char* dst = reinterpret_cast<unsigned char*>(m_charbuf.data());
                for (unsigned int i = 0; i < VALERION_MAT_PAYLOAD; i += 2)
                {
                  dst[VALERION_MAT_RESERVED + i] =
                      src[VALERION_MAT_RESERVED + i + 1];
                  dst[VALERION_MAT_RESERVED + i + 1] =
                      src[VALERION_MAT_RESERVED + i];
                }
                outputSize = TRUEHD_SIZE;
              }
              else
              {
                // Mode 0: exact CPackerMAT frame untouched.
                memcpy(m_charbuf.data(), src, TRUEHD_SIZE);
                outputSize = TRUEHD_SIZE;
              }
          
              if (diagnosticThisCall)
              {
                const unsigned char* out =
                    reinterpret_cast<const unsigned char*>(m_charbuf.data());
                CLog::Log(LOGINFO,
                          "VALERION_MAT: FIX6D mode={} outSize={} "
                          "out16={:02x} {:02x} {:02x} {:02x} {:02x} {:02x} {:02x} {:02x} "
                          "{:02x} {:02x} {:02x} {:02x} {:02x} {:02x} {:02x} {:02x}",
                          mode, outputSize,
                          static_cast<unsigned int>(out[0]), static_cast<unsigned int>(out[1]),
                          static_cast<unsigned int>(out[2]), static_cast<unsigned int>(out[3]),
                          static_cast<unsigned int>(out[4]), static_cast<unsigned int>(out[5]),
                          static_cast<unsigned int>(out[6]), static_cast<unsigned int>(out[7]),
                          static_cast<unsigned int>(out[8]), static_cast<unsigned int>(out[9]),
                          static_cast<unsigned int>(out[10]), static_cast<unsigned int>(out[11]),
                          static_cast<unsigned int>(out[12]), static_cast<unsigned int>(out[13]),
                          static_cast<unsigned int>(out[14]), static_cast<unsigned int>(out[15]));
              }
          
              // One bounded capture per AudioTrack. This is diagnostic data, not a validity claim.
              if (!m_valerionMatDumped)
              {
                m_valerionMatDumped = true;
                auto dump = [](const std::string& path, const void* bytes, size_t length)
                {
                  XFILE::CFile file;
                  if (!file.OpenForWrite(path, true))
                  {
                    CLog::Log(LOGERROR, "VALERION_MAT: FIX6D dump open failed {}", path);
                    return;
                  }
                  size_t done = 0;
                  while (done < length)
                  {
                    const auto n = file.Write(static_cast<const char*>(bytes) + done, length - done);
                    if (n <= 0 || static_cast<size_t>(n) > length - done)
                      break;
                    done += static_cast<size_t>(n);
                  }
                  file.Close();
                  CLog::Log(LOGINFO, "VALERION_MAT: FIX6D dump {} bytes={}/{} complete={}",
                            path, done, length, done == length);
                };
                dump("special://temp/valerion-mat-FIX6D-input.bin", src, inputSize);
                dump("special://temp/valerion-mat-FIX6D-output.bin", m_charbuf.data(), outputSize);
              }
          
              const uint64_t writeStart = CurrentHostCounter();
              int matWritten = 0;
              unsigned int writeCalls = 0;
              while (matWritten < outputSize)
              {
                // Continue from the output byte offset, never resubmit an accepted prefix.
                const int n = m_at_jni->write(m_charbuf, matWritten, outputSize - matWritten,
                                              CJNIAudioTrack::WRITE_BLOCKING);
                ++writeCalls;
                if (n == 0 && matWritten == 0)
                  return 0; // Existing AddPackets zero-progress retry; nothing consumed.
                if (n <= 0 || n > outputSize - matWritten)
                {
                  m_valerionMatFailed = true;
                  CLog::Log(LOGERROR,
                            "VALERION_MAT: FIX6D write stopped accepted={} expected={} result={} STOP",
                            matWritten, outputSize, n);
                  return -1; // Do not replay a partly submitted frame on this track.
                }
                matWritten += n;
              }
              if (diagnosticThisCall || writeCalls > 1)
              {
                const double writeMs = 1000.0 * (CurrentHostCounter() - writeStart) / CurrentHostFrequency();
                CLog::Log(LOGINFO,
                          "VALERION_MAT: FIX6D mode={} inputBytes={} outputBytes={} result={} calls={} writeMs={} head={} durationMs={}",
                          mode, inputSize, outputSize, matWritten, writeCalls, writeMs,
                          m_at_jni->getPlaybackHeadPosition(), m_duration_written * 1000.0);
              }
          
              // All ORIGINAL 61440 input bytes were consumed even when Mode 1/3 emits 61432.
              written = inputSize;
            }
            else if (m_jniAudioFormat == CJNIAudioFormat::ENCODING_IEC61937)
            {
              if (m_shortbuf.size() < (sizeInBytes - offsetInBytes) / sizeof(int16_t))
                m_shortbuf.resize((sizeInBytes - offsetInBytes) / sizeof(int16_t));
              memcpy(m_shortbuf.data(), audioData + offsetInBytes, sizeInBytes - offsetInBytes);
              written = m_at_jni->write(m_shortbuf, 0, (sizeInBytes - offsetInBytes) / sizeof(int16_t),
                                        CJNIAudioTrack::WRITE_BLOCKING);
              written *= sizeof(uint16_t);
            }
          '''
          replace_once(AUDIO, old, new, "FIX6D runtime native MAT multi-mode writer")
          
          # Log Android's buffer query and AudioTrack state around the single creation attempt.
          old = '''    m_min_buffer_size = (unsigned int) min_buffer;
              CLog::Log(LOGINFO, "Minimum size we need for stream: {} Bytes", m_min_buffer_size);
          '''
          new = '''    m_min_buffer_size = (unsigned int) min_buffer;
              CLog::Log(LOGINFO, "Minimum size we need for stream: {} Bytes", m_min_buffer_size);
              if (m_encoding == VALERION_ENCODING_DOLBY_MAT &&
                  m_format.m_streamInfo.m_type == CAEStreamInfo::STREAM_TYPE_TRUEHD)
              {
                CLog::Log(LOGINFO,
                          "VALERION_MAT: getMinBufferSize={} sampleRate={} channelMask={} encoding={}",
                          min_buffer, m_sink_sampleRate, atChannelMask, m_encoding);
              }
          '''
          replace_once(AUDIO, old, new, "MAT min buffer diagnostics")
          
          # FIX6D: keep Kodi's STOCK RAW TrueHD geometry.
          # The RAW branch should produce frameSize=1, frames=61440 and buffer=122880.
          old = '''    if (m_passthrough && !m_info.m_wantsIECPassthrough)
                m_audiotrackbuffer_sec = rawlength_in_seconds;
          
              CLog::Log(LOGINFO,
                        "Created Audiotrackbuffer with playing time of {:f} ms min buffer size: {} bytes",
                        m_audiotrackbuffer_sec * 1000, m_min_buffer_size);
          '''
          new = '''    if (m_passthrough && !m_info.m_wantsIECPassthrough)
                m_audiotrackbuffer_sec = rawlength_in_seconds;
          
              if (m_encoding == VALERION_ENCODING_DOLBY_MAT &&
                  m_format.m_streamInfo.m_type == CAEStreamInfo::STREAM_TYPE_TRUEHD)
              {
                CLog::Log(LOGINFO,
                          "VALERION_MAT: FIX6D geometry method=RAW frameSize={} frames={} buffer={} rate={} channels={}",
                          m_format.m_frameSize, m_format.m_frames, m_min_buffer_size,
                          m_sink_sampleRate, m_format.m_channelLayout.Count());
          
                if (m_format.m_frameSize != 1 || m_format.m_frames != TRUEHD_SIZE)
                {
                  CLog::Log(LOGERROR,
                            "VALERION_MAT: FIX6D unsafe geometry - refusing MAT test");
                  return false;
                }
              }
          
              CLog::Log(LOGINFO,
                        "Created Audiotrackbuffer with playing time of {:f} ms min buffer size: {} bytes",
                        m_audiotrackbuffer_sec * 1000, m_min_buffer_size);
          '''
          replace_once(AUDIO, old, new, "FIX6D preserve and verify RAW MAT geometry")
          
          old = '''    m_jniAudioFormat = m_encoding;
              m_at_jni = CreateAudioTrack(stream, m_sink_sampleRate, atChannelMask,
                                          m_encoding, m_min_buffer_size);
          
              if (!IsInitialized())
          '''
          new = '''    m_jniAudioFormat = m_encoding;
              if (m_encoding == VALERION_ENCODING_DOLBY_MAT &&
                  m_format.m_streamInfo.m_type == CAEStreamInfo::STREAM_TYPE_TRUEHD)
              {
                CLog::Log(LOGINFO,
                          "VALERION_MAT: FIX6D creating AudioTrack requestedBuffer={} mode=STREAM",
                          m_min_buffer_size);
              }
              m_at_jni = CreateAudioTrack(stream, m_sink_sampleRate, atChannelMask,
                                          m_encoding, m_min_buffer_size);
          
              if (m_encoding == VALERION_ENCODING_DOLBY_MAT &&
                  m_format.m_streamInfo.m_type == CAEStreamInfo::STREAM_TYPE_TRUEHD)
              {
                const int state = m_at_jni ? m_at_jni->getState() : -1;
                CLog::Log(LOGINFO, "VALERION_MAT: FIX6D AudioTrack state={}", state);
              }
          
              if (!IsInitialized())
          '''
          replace_once(AUDIO, old, new, "MAT AudioTrack creation diagnostics")
          
          # Q0718 safety: for this MAT experiment, never perform Kodi's stock 200 ms
          # passthrough retry. Release once and return.
          old = '''      else
                {
                  if (!retried)
                  {
                    retried = true;
                    CLog::Log(LOGWARNING, "AESinkAUDIOTRACK - Unable to open PT device - will retry once");
                    // Seems that some devices don't properly implement pause + flush, which during seek
                    // might open the device too fast - let's retry
                    usleep(200 * 1000);
                    continue;
                  }
                }
          '''
          new = '''      else
                {
                  if (m_encoding == VALERION_ENCODING_DOLBY_MAT &&
                      m_format.m_streamInfo.m_type == CAEStreamInfo::STREAM_TYPE_TRUEHD)
                  {
                    CLog::Log(LOGERROR,
                              "VALERION_MAT: AudioTrack initialization failed - NO RETRY");
                  }
                  else if (!retried)
                  {
                    retried = true;
                    CLog::Log(LOGWARNING, "AESinkAUDIOTRACK - Unable to open PT device - will retry once");
                    // Seems that some devices don't properly implement pause + flush, which during seek
                    // might open the device too fast - let's retry
                    usleep(200 * 1000);
                    continue;
                  }
                }
          '''
          replace_once(AUDIO, old, new, "disable MAT retry")
          
          # Log the first transition to PLAYING for the MAT track.
          old = '''    if (m_at_jni->getPlayState() != CJNIAudioTrack::PLAYSTATE_PLAYING)
                m_at_jni->play();
          '''
          new = '''    if (m_at_jni->getPlayState() != CJNIAudioTrack::PLAYSTATE_PLAYING)
              {
                if (m_jniAudioFormat == VALERION_ENCODING_DOLBY_MAT &&
                    m_format.m_streamInfo.m_type == CAEStreamInfo::STREAM_TYPE_TRUEHD)
                  CLog::Log(LOGINFO, "VALERION_MAT: FIX6D play() reached");
                m_at_jni->play();
              }
          '''
          replace_once(AUDIO, old, new, "MAT play diagnostics")
          
          print("Valerion direct MAT patch FIX6D applied successfully (RAW geometry + runtime modes 0-4).")
          
          HEADER = ROOT / "xbmc/cores/AudioEngine/Sinks/AESinkAUDIOTRACK.h"
          replace_once(AUDIO, '#include "ServiceBroker.h"\n',
                       '#include "ServiceBroker.h"\n#include "filesystem/File.h"\n', "FIX6D dump API")
          replace_once(HEADER, '  std::vector<char> m_charbuf;\n',
                       '  int m_valerionMatMode = -1;\n'
                       '  bool m_valerionMatFailed = false;\n'
                       '  bool m_valerionMatDumped = false;\n'
                       '  unsigned int m_valerionMatCalls = 0;\n'
                       '  std::vector<char> m_charbuf;\n', "FIX6D per-track diagnostic state")
          replace_once(AUDIO,
                       'bool CAESinkAUDIOTRACK::Initialize(AEAudioFormat &format, std::string &device)\n{\n',
                       'bool CAESinkAUDIOTRACK::Initialize(AEAudioFormat &format, std::string &device)\n{\n'
                       '  m_valerionMatMode = -1;\n'
                       '  m_valerionMatFailed = false;\n'
                       '  m_valerionMatDumped = false;\n'
                       '  m_valerionMatCalls = 0;\n', "FIX6D reset state on initialization")
          VALERION_PATCH
          python3 "$RUNNER_TEMP/apply_valerion_mat_patch.py" "$GITHUB_WORKSPACE/kodi"
          cp "$RUNNER_TEMP/apply_valerion_mat_patch.py" valerion-mat-patcher.py
          git -C kodi diff --check
          git -C kodi diff > valerion-mat-applied.patch
          grep -a -n 'VALERION_MAT' kodi/xbmc/cores/AudioEngine/Sinks/AESinkAUDIOTRACK.cpp
          grep -a -n 'FIX6D ActiveAE' kodi/xbmc/cores/AudioEngine/Engines/ActiveAE/ActiveAESink.cpp
          grep -a -n 'debug.kodi.mat.mode' kodi/xbmc/cores/AudioEngine/Sinks/AESinkAUDIOTRACK.cpp
          grep -a -n 'sys/system_properties.h' kodi/xbmc/cores/AudioEngine/Sinks/AESinkAUDIOTRACK.cpp
          grep -n 'return false;' kodi/xbmc/cores/VideoPlayer/Process/android/ProcessInfoAndroid.cpp
          grep '^APP_PACKAGE ' kodi/version.txt
          grep 'Kodi Valerion MAT Test' kodi/tools/android/packaging/xbmc/strings.xml.in

      - name: Create disposable APK signing key
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keypass android -storepass android \
            -keyalg RSA -keysize 2048 -validity 10000
          echo "KODI_ANDROID_STORE_FILE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo 'KODI_ANDROID_KEY_ALIAS=androiddebugkey' >> "$GITHUB_ENV"
          echo 'KODI_ANDROID_KEY_PASSWORD=android' >> "$GITHUB_ENV"
          echo 'KODI_ANDROID_STORE_PASSWORD=android' >> "$GITHUB_ENV"

      - name: Configure and build Kodi Android dependencies ARMv7
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs "$HOME/android-tools/xbmc-tarballs" "$HOME/android-tools/xbmc-depends"
          cd kodi/tools/depends
          ./bootstrap 2>&1 | tee "$GITHUB_WORKSPACE/logs/01-bootstrap.log"
          ./configure \
            --with-tarballs="$HOME/android-tools/xbmc-tarballs" \
            --host=arm-linux-androideabi \
            --with-sdk-path="$ANDROID_SDK_ROOT" \
            --with-ndk-path="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" \
            --prefix="$HOME/android-tools/xbmc-depends" \
            2>&1 | tee "$GITHUB_WORKSPACE/logs/02-depends-configure.log"
          make -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/logs/03-depends-build.log"

      - name: Configure Kodi CMake build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$HOME/kodi-build"
          make -C kodi/tools/depends/target/cmakebuildsys \
            BUILD_DIR="$HOME/kodi-build" \
            2>&1 | tee logs/04-cmake-configure.log

      - name: Build Kodi and APK
        shell: bash
        run: |
          set -o pipefail
          make -C "$HOME/kodi-build" -j"$(nproc)" 2>&1 | tee logs/05-kodi-build.log
          make -C "$HOME/kodi-build" apk 2>&1 | tee logs/06-apk-package.log

      - name: Collect and verify ARMv7 APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p output
          mapfile -t apks < <(find "$GITHUB_WORKSPACE/kodi" "$HOME/kodi-build" -type f -name '*.apk' -print | sort -u)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo 'No APK was produced.' >&2
            exit 1
          fi
          printf '%s\n' "${apks[@]}" | tee logs/07-apk-list.log
          n=0
          for apk in "${apks[@]}"; do
            n=$((n+1))
            out="output/Kodi-Valerion-MAT-Test-armv7-${n}.apk"
            cp "$apk" "$out"
            unzip -l "$out" > "logs/08-apk-contents-${n}.log"
            grep -q 'lib/armeabi-v7a/' "logs/08-apk-contents-${n}.log"
          done

      - name: Upload installable MAT APK
        uses: actions/upload-artifact@v4
        with:
          name: Kodi-Valerion-MAT-Test-ARMv7
          path: output/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload MAT patch and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kodi-Valerion-MAT-build-diagnostics
          path: |
            kodi-upstream-commit.txt
            valerion-mat-applied.patch
            valerion-mat-patcher.py
            logs/
          if-no-files-found: warn
          retention-days: 14
